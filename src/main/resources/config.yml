# StillThinkingOfaNameWelcome Configuration

# List of player UUIDs who have hidden the BossBar
# This list is managed automatically by the /togglebar command
hidden-bossbar-players: []

# Starter Kit Configuration
starter-kit:
  inventory-items:
    - material: IRON_SWORD
      amount: 1
    - material: IRON_PICKAXE
      amount: 1
    - material: IRON_AXE
      amount: 1
    - material: IRON_SHOVEL
      amount: 1
    - material: COOKED_BEEF
      amount: 32
    - material: OAK_LOG
      amount: 64
    - material: TORCH
      amount: 64
  armor:
    helmet:
      material: IRON_HELMET
      amount: 1
    chestplate:
      material: IRON_CHESTPLATE
      amount: 1
    leggings:
      material: IRON_LEGGINGS
      amount: 1
    boots:
      material: IRON_BOOTS
      amount: 1
  offhand: null

# List of player UUIDs who have claimed the starter kit
claimed-starter-kit-players: []

# Map of player UUID to first join timestamp (milliseconds)
first-join-times: {}

# Map of player UUID to warning shown count (max 2)
warning-shown-count: {}

# Auto Restart Configuration
auto-restart:
  # Recurring restart times (format: Day;HH:MM)
  # Days: Daily, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
  restart-times:
    - "Daily;03:00"
  
  # One-time restart (format: HH:MM, only executes once)
  # Set to empty string to disable
  one-time-restart: ""

  # Broadcast warnings in seconds before restart
  messages:
    "300": "&cServer restart dalam 5 menit."
    "60": "&cServer restart dalam 1 menit."
    "10": "&cServer restart dalam 10 detik."
    "5": "&cRestarting in 5 seconds"
    "4": "&cRestarting in 4 seconds"
    "3": "&cRestarting in 3 seconds"
    "2": "&cRestarting in 2 seconds"
    "1": "&cRestarting in 1 second"
    "0": "&cServer restarting now."

  titles:
    "8": "&4&lWARNING!"

  subtitles:
    "8": "&6Server Restarting"

  # Apply blindness to every online player during countdown (5-1 seconds)
  blindness:
    enabled: true

  # Console commands run at restart time
  commands:
    - "restart"
